name: Refresh official announcements
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-events
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Display trigger and UTC run time
        run: |
          echo "Trigger: ${{ github.event_name }}"
          date -u '+Run started (UTC): %Y-%m-%d %H:%M:%S'
      - name: Collect public announcements
        run: python scripts/collect.py
      - name: Extract explicitly dated upcoming event candidates
        run: python scripts/collect_verified_events.py
      - name: Commit changes
        run: |
          if git diff --quiet -- data/events.json data/verified-events.json data/event-history.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/verified-events.json data/event-history.json
          git commit -m "Refresh verified official announcements"
          git push
