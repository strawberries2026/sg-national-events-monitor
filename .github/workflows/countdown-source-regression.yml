name: Countdown source priority regression
on:
  pull_request:
    paths:
      - 'scripts/check_national_event_sources.py'
      - 'tests/test_countdown_source_priority.py'
      - '.github/workflows/countdown-source-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector and regression test syntax
        run: python -m compileall -q scripts/check_national_event_sources.py tests/test_countdown_source_priority.py
      - name: Test countdown source priority and no date auto-verification
        run: python -m unittest discover -s tests -p 'test_countdown_source_priority.py' -v
