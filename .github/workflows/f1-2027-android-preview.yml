name: F1 2027 Android preview package
on:
  push:
    branches:
      - feat/f1-singapore-2027-verified-event
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate F1 event data and integration
        run: node tests/verify-f1-2027.cjs
      - name: Assemble isolated Android browser preview
        run: |
          mkdir -p preview/data preview/icons
          cp index.html manifest.webmanifest preview/
          cp data/events.json data/verified-events.json preview/data/
          cp icons/* preview/icons/
          if test -f service-worker.js; then cp service-worker.js preview/; fi
          if test -f sw.js; then cp sw.js preview/; fi
          cd preview && zip -r ../sg-national-events-f1-2027-preview.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: sg-national-events-f1-2027-preview
          path: sg-national-events-f1-2027-preview.zip
          retention-days: 7
